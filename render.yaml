services:
  - type: web
    name: arcanjo-yayx
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: arcanjo-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: RUN_SEED
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      - key: RATE_LIMIT_MAX
        value: "300"
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"
      - key: CACHE_TTL_MS
        value: "30000"
      - key: JSON_BODY_LIMIT
        value: 5mb

databases:
  - name: arcanjo-db
    plan: free
    databaseName: arcanjo
    user: arcanjo
