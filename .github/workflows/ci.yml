name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [backend, frontend]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar vulnerabilidades
        run: npm audit --audit-level=high

      - name: Rodar lint
        run: npm run lint

      - name: Rodar testes do backend
        if: matrix.app == 'backend'
        run: npm test

      - name: Gerar build do frontend
        if: matrix.app == 'frontend'
        run: npm run build
